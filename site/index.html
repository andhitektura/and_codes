<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#232323">
  <title>{{TITLE}}</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/and_Lubrifont/andLubrifont-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/and_Lubrifont/andLubrifont-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Прескокни до содржината</a>
  <div class="app">
    <nav class="rail" id="left" aria-label="Прописи">
      <a class="brand" href="#/" title="{{TITLE}}"><img src="brand/mark.svg" alt="AND"><span>_codes</span></a>
      <div class="countries" id="countries"></div>
      <ul class="rail-root" id="rail-root"></ul>
      <ol class="themes" id="themes"></ol>
    </nav>

    <header class="topbar">
      <button class="icon-btn only-narrow" id="toggle-left" aria-label="Прописи" title="Прописи"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search-wrap">
        <label class="search-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l5.5 5.5"/></svg>
          <input id="search" type="search" placeholder="пребарај прописи и членови  (Ctrl+K)" autocomplete="off" spellcheck="false">
        </label>
        <div id="search-results" class="search-results" hidden>
          <div class="search-filters">
            <select id="search-theme" aria-label="Тема"><option value="">Сите теми</option></select>
            <label><input type="checkbox" id="search-archive"> вклучи претходни редакции</label>
          </div>
          <div id="search-list"></div>
        </div>
      </div>
      <button class="icon-btn only-medium" id="toggle-right" aria-label="Алатки" title="Алатки"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </header>

    <main class="main" id="main" tabindex="-1">
      <div class="loading">Се вчитува…</div>
    </main>

    <aside class="right" id="right" aria-label="Алатки">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="toc">Содржина</button>
        <button role="tab" data-tab="links">Врски</button>
        <button role="tab" data-tab="pins">Закачени <span class="badge" id="pin-count" hidden></span></button>
        <button role="tab" data-tab="tree">Дрво</button>
      </div>
      <section class="tab-panel" data-panel="toc" id="toc"></section>
      <section class="tab-panel" data-panel="links" id="links"></section>
      <section class="tab-panel" data-panel="pins" id="pins"></section>
      <section class="tab-panel" data-panel="tree" id="tree"></section>
    </aside>
  </div>

  <div id="popovers"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
