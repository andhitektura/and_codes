<!doctype html>
<html lang="mk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem('and_codes.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-narrow" id="toggle-left" aria-label="Мени" title="Мени"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="#/" id="brand">{{TITLE}}</a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Пребарај прописи и членови…  (Ctrl+K)" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <button class="icon-btn" id="toggle-theme" aria-label="Тема" title="Светла / темна тема"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button class="icon-btn only-medium" id="toggle-right" aria-label="Панел" title="Панел"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </header>

  <div class="layout">
    <nav class="left" id="left" aria-label="Датотеки">
      <div class="panel-title">Датотеки</div>
      <div id="explorer" class="explorer"></div>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="loading">Се вчитува…</div>
    </main>

    <aside class="right" id="right" aria-label="Алатки">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="toc">Содржина</button>
        <button role="tab" data-tab="links">Поврзано</button>
        <button role="tab" data-tab="pins">Закачени <span class="badge" id="pin-count" hidden></span></button>
        <button role="tab" data-tab="tree">Дрво</button>
      </div>
      <section class="tab-panel" data-panel="toc" id="toc"></section>
      <section class="tab-panel" data-panel="links" id="links"></section>
      <section class="tab-panel" data-panel="pins" id="pins"></section>
      <section class="tab-panel" data-panel="tree" id="tree"></section>
    </aside>
  </div>

  <div id="popovers"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
